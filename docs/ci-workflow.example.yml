name: Build and security verification
on:
  pull_request:
  push:
    branches: [main, arena/6a867e23-hannah-home]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx next build
      - run: npm audit --audit-level=high
